<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <meta name="robots" content="noindex, nofollow" />
  <title>PORTDUEL</title>
  <link rel="stylesheet" href="/half-baked/assets/css/newday.css" />
</head>
<body>
  <div class="nd-back-hotspot">
    <a class="nd-back" href="/half-baked/">&larr; Back</a>
  </div>

  <!-- Zoom readout + slider. board.js keeps the slider, the readout and
       the board transform in sync whichever one the user drives. The
       slider's min/max/value are the zoom limits and the opening zoom. -->
  <div class="nd-zoom" role="group" aria-label="Zoom">
    <input class="nd-zoom-slider" type="range" min="25" max="200" step="1" value="60" aria-label="Zoom level" />
    <output class="nd-zoom-readout" aria-live="off">60%</output>
  </div>

  <main class="nd-page-content">
    <!-- Notepad: a big fixed-size sheet (see .nd-board in newday.css) that
         pans and zooms. To add a note, drop another <section class="nd-note">
         on the board with --x/--y for its top-left corner in sheet px;
         the sheet is 3200 x 2000. -->
    <div class="nd-board-viewport" data-nd-board>
      <div class="nd-board">
        <section class="nd-note" style="--x: 160px; --y: 160px;">
          <h1>Portduel</h1>
          <p>Two domains are registered for the project:</p>
          <div class="nd-note-actions">
            <button type="button" class="nd-chip">portduel.com</button>
            <button type="button" class="nd-chip">portduel.app</button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="/half-baked/assets/js/page.js" defer></script>
  <script src="/half-baked/assets/js/board.js" defer></script>
</body>
</html>
