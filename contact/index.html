<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Shared head boilerplate — kept in sync by hand across all 10 pages, see TBD.md #6. Page-specific tags go after the fontawesome <link>. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

  <title>Contact — Connor Button</title>
  <meta name="description" content="Get in touch with Connor Button — send a message directly via the contact form." />
  <link rel="canonical" href="https://www.connorbutton.ca/contact/" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Connor Button" />
  <meta property="og:title" content="Contact — Connor Button" />
  <meta property="og:description" content="Get in touch with Connor Button — send a message directly via the contact form." />
  <meta property="og:url" content="https://www.connorbutton.ca/contact/" />
  <meta property="og:image" content="https://www.connorbutton.ca/assets/images/background.jpg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Contact — Connor Button" />
  <meta name="twitter:description" content="Get in touch with Connor Button — send a message directly via the contact form." />
  <meta name="twitter:image" content="https://www.connorbutton.ca/assets/images/background.jpg" />

  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="stylesheet" href="/assets/css/main.min.css" />
  <link rel="stylesheet" href="/assets/css/fontawesome.min.css" />
</head>
<body>
    <div id="site-nav"></div>

  <section class="section">
    <div class="contact-wrap card">
      <h2>Contact Me</h2>
      <p class="small contact-subtitle">Send me a message!</p>
      <form id="contact-form" method="POST" action="https://formspree.io/f/mgvylkyl">
        <div class="row">
          <div class="form-group">
            <label for="name">Name</label>
            <input id="name" name="name" class="form-control" type="text" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" class="form-control" type="email" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" class="form-control" type="text" placeholder="What’s this about?" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" class="form-control" placeholder="Write your message…" required></textarea>
        </div>
        <div class="flex form-actions">
          <button class="btn btn--primary" type="submit">Send Message</button>
          <button class="btn btn--outline" type="reset">Reset</button>
        </div>
        <p id="form-status" class="small form-status"></p>
      </form>
    </div>
  </section>
  <script>
  const form = document.getElementById('contact-form');
  const statusEl = document.getElementById('form-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = 'Sending…';

    try {
      const data = new FormData(form);
      const res = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (res.ok) {
        form.reset();
        statusEl.textContent = 'Thanks! Your message was sent.';
      } else {
        const err = await res.json().catch(() => ({}));
        statusEl.textContent = (err && err.errors && err.errors[0]?.message) || 'Oops, something went wrong. Please try again.';
      }
    } catch (err) {
      statusEl.textContent = 'Network error. Please try again.';
    }
  });
</script>

<script src="/assets/js/nav.js"></script>

</body>
</html>
