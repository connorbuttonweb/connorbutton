</head>
<body>

        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon"></span>
                <a href="/" class="logo-text">CONNOR BUTTON</a>
            </div>

              <button class="mobile-toggle" aria-label="Open navigation">
                  <span class="bar"></span>
                  <span class="bar"></span>
                  <span class="bar"></span>
              </button>

            <ul class="nav-menu">
                <li><a href="/" class="nav-link" id="nav-home">HOME</a></li>
                <li><a href="/#about" class="nav-link" id="nav-about">ABOUT</a></li>
                <li><a href="/assets/documents/Connor Button Resume.pdf" class="nav-link" target="_blank" id="nav-resume">RESUME</a></li>
                <li class="dropdown">
                    <a href="/portfolios/" class="nav-link" id="nav-portfolios">PORTFOLIOS <i class="fas fa-chevron-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="/pines/">Pines Landscaping</a></li>

            </ul>

            <div class="nav-right">
                <a href="/contact/" class="contact-btn">Contact Me</a>
            </div>
        </div>
    </nav>

  <section class="section">
    <div class="contact-wrap card">
      <h2>Contact Me</h2>
      <p class="small contact-subtitle">Send me a message!</p>
      <form id="contact-form" method="POST" action="https://formspree.io/f/mgvylkyl">
        <div class="row">
          <div class="form-group">
            <label for="name">Name</label>
            <input id="name" name="name" class="form-control" type="text" placeholder="Your name" required />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" name="email" class="form-control" type="email" placeholder="you@example.com" required />
          </div>
        </div>
        <div class="form-group">
          <label for="subject">Subject</label>
          <input id="subject" name="subject" class="form-control" type="text" placeholder="What’s this about?" required />
        </div>
        <div class="form-group">
          <label for="message">Message</label>
          <textarea id="message" name="message" class="form-control" placeholder="Write your message…" required></textarea>
        </div>
        <div class="flex form-actions">
          <button class="btn btn--primary" type="submit">Send Message</button>
          <button class="btn btn--outline" type="reset">Reset</button>
        </div>
        <p id="form-status" class="small form-status"></p>
      </form>
    </div>
  </section>
  <script>
  const form = document.getElementById('contact-form');
  const statusEl = document.getElementById('form-status');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    statusEl.textContent = 'Sending…';

    try {
      const data = new FormData(form);
      const res = await fetch(form.action, {
        method: form.method,
        body: data,
        headers: { 'Accept': 'application/json' }
      });

      if (res.ok) {
        form.reset();
        statusEl.textContent = 'Thanks! Your message was sent.';
      } else {
        const err = await res.json().catch(() => ({}));
        statusEl.textContent = (err && err.errors && err.errors[0]?.message) || 'Oops, something went wrong. Please try again.';
      }
    } catch (err) {
      statusEl.textContent = 'Network error. Please try again.';
    }
  });
</script>

<script src="/assets/js/nav.js"></script>

</body>
</html>
