<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>Portfolio Fact Sheet — Connor Button</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
  <link rel="stylesheet" href="/assets/css/main.min.css" />
  <link rel="stylesheet" href="/assets/css/fontawesome.min.css">
</head>

<body>
    <div id="site-nav"></div>

  <section class="section">
    <div class="container">

      <div class="page-title-group">
        <div class="page-title-heading">
          <h1 class="page-title">Portfolio Fact Sheet</h1>
        </div>
        <p class="page-subtitle">
          My own portfolio, reported the way a fund reports itself — performance per $10,000
          invested, and a look-through that shows every company actually owned once the ETFs
          are unpacked.
        </p>
      </div>

      <div class="fs-hero">
        <div class="splits" id="fs-facts"></div>
        <p class="dash-stamp" id="fs-stamp"></p>
      </div>

    </div>
  </section>

  <!-- Sticky section nav: pins under the site navbar, highlights the section in view -->
  <nav class="fs-subnav" id="fs-subnav" aria-label="Fact sheet sections">
    <div class="container">
      <ul id="fs-subnav-list"></ul>
    </div>
  </nav>

  <section class="section">
    <div class="container">
      <div id="fs-sections" aria-live="polite">
        <div class="dash-empty" id="fs-boot">
          <i class="fas fa-circle-notch fa-spin" aria-hidden="true"></i> Loading portfolio…
        </div>
      </div>
    </div>
  </section>

  <!-- Bundled from assets/js/dashboard/**/*.js — edit those, not this file.
       Regenerate: cd asset-pipeline && npm run build:js -->
  <script src="/assets/js/dashboard.bundle.min.js"></script>
  <script src="/assets/js/nav.js"></script>
</body>
</html>
