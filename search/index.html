<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <base target="_blank">
    <title>Portfolio Selections — Connor Button</title>
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; display: flex;
        flex-direction: column; align-items: center;
        justify-content: center; height: 100vh; background: #fff; padding-top: 0 !important; }
        .logo { font-size: 72px; font-weight: 500; margin-bottom: 32px; }
        .logo span:nth-child(1){color:#21808D}
        .logo span:nth-child(2){color:#FF5459}
        .logo span:nth-child(3){color:#E68161}
        .logo span:nth-child(4){color:#32B8C6}
        .logo span:nth-child(5){color:#13343B}
        .logo span:nth-child(6){color:#5E5240}
        input { width: min(560px, 100%); padding: 14px 20px; font-size: 16px;
        border: 1px solid #dfe1e5; border-radius: 24px; outline: none; }
        input:focus { box-shadow: 0 0 0 2px #4285F4; border-color: transparent; }
        .btns { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .search-wrapper { padding: 0 20px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        button { padding: 10px 20px; font-size: 14px; border: 1px solid #dfe1e5;
        border-radius: 6px; background: #f8f9fa; cursor: pointer; }
        button:hover { border-color: #aaa; }
    </style>
</head>

<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-icon"></span>
                <a href="/" class="logo-text">CONNOR BUTTON</a>
            </div>
            
              <button class="mobile-toggle" aria-label="Open navigation">
                  <span class="bar"></span>
                  <span class="bar"></span>
                  <span class="bar"></span>
              </button>

            <ul class="nav-menu">
                <li><a href="/" class="nav-link" id="nav-home">HOME</a></li>
                <li><a href="/#about" class="nav-link" id="nav-about">ABOUT</a></li>
                <li><a href="/assets/documents/Connor Button Resume.pdf" class="nav-link" target="_blank" id="nav-resume">RESUME</a></li>
                <li><a href="/predictionmarket/" class="nav-link" id="nav-prediction">Prediction Engine & Charts</a></li>
                <li class="dropdown">
                    <a href="/portfolios/" class="nav-link" id="nav-portfolios">PORTFOLIOS <i class="fas fa-chevron-down"></i></a>
                    <ul class="dropdown-menu">
                        <li><a href="/pines/">Pines Landscaping</a></li>
                        <li><a href="/wallstreetprep/">Wall Street Prep</a></li>
                        <li><a href="/website/">Website Build</a></li>
                        <li><a href="/hyrox/">HYROX</a></li>
                        <li><a href="/documents/">Documents</a></li>
                        <li><a href="/predictionmarket/">Prediction Markets</a></li>
                    </ul>
                </li>
            </ul>

            <div class="nav-right">
                <a href="/contact/" class="contact-btn">Contact Me</a>
            </div>
        </div>
    </nav>

    <section class="search-wrapper">
        <div class="logo">
            <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
        </div>
            <input id="q" type="text" onkeydown="if(event.key==='Enter')s()"/>
        <div class="btns">
            <button onclick="window.open('https://mail.google.com', '_blank')">Gmail</button>
            <button onclick="window.open('', '_blank')">Profiles</button>
            <button onclick="window.open('https://github.com/connorbuttonweb', '_blank')">GitHub</button>
        </div>
        <script>
            function s() {
                var q = document.getElementById('q').value;
                if (q) window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank');
            }
        </script>
    </section>

  <script src="/assets/js/nav.js"></script>
</body>
</html>
