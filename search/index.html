<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>Search</title>
    <link rel="icon" type="image/png" href="/assets/images/googicon.png" />
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: Arial, sans-serif; display: flex;
        flex-direction: column; align-items: center;
        justify-content: center; height: 100vh; background: #fff; padding-top: 0 !important; }
        .logo { font-size: 72px; font-weight: 500; margin-bottom: 32px; }
        .logo span:nth-child(1){color:#4285F4}
        .logo span:nth-child(2){color:#EA4335}
        .logo span:nth-child(3){color:#FBBC05}
        .logo span:nth-child(4){color:#4285F4}
        .logo span:nth-child(5){color:#34A853}
        .logo span:nth-child(6){color:#EA4335}
        .btns { margin-top: 20px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
        .search-wrapper { padding: 0 20px; width: 100%; display: flex; flex-direction: column; align-items: center; }
        button { padding: 10px 20px; font-size: 14px; border: 1px solid #dfe1e5;
        border-radius: 6px; background: #f8f9fa; cursor: pointer; color: #3c4043; }
        button:hover { border-color: #aaa; background: #f1f3f4; }
        #search-box { width: min(560px,100%); position: relative; }
        #q { width:100%; padding:14px 48px 14px 20px; font-size:16px; border:1px solid #dfe1e5; border-radius:24px; outline:none; background:#fff; color:#202124; }
        #q:focus { box-shadow:0 1px 6px rgba(32,33,36,.28); border-color:rgba(223,225,229,0); border-radius:24px; }
        #q.open { border-radius:24px 24px 0 0 !important; }
        #drop { display:none; position:absolute; top:100%; left:0; right:0; background:#fff;
            border:1px solid rgba(223,225,229,0); border-top:none;
            box-shadow:0 4px 6px rgba(32,33,36,.28); border-radius:0 0 24px 24px;
            list-style:none; padding:4px 0 8px; z-index:200; }
        #drop li { padding:10px 20px; font-size:15px; cursor:pointer; color:#202124; display:flex; align-items:center; gap:12px; }
        #drop li::before { content:'\f002'; font-family:'Font Awesome 6 Free'; font-weight:900; color:#9aa0a6; font-size:13px; flex-shrink:0; }
        #drop li.active, #drop li:hover { background:#f8f9fa; }
    </style>
</head>

<body>
    <div id="site-nav"></div>

    <div class="stock-ticker" id="stock-ticker" aria-hidden="true">
        <span class="stock-ticker__badge">CA</span>
        <div class="stock-ticker__track" id="ticker-track"></div>
    </div>

    <div class="market-leaders" id="market-leaders" aria-hidden="true">
        <div class="market-leaders__section">
            <div id="leaders-top"></div>
            <span class="market-leaders__label market-leaders__label--up">▲ TOP</span>
        </div>
        <div class="market-leaders__divider"></div>
        <div class="market-leaders__section">
            <span class="market-leaders__label market-leaders__label--down">▼ BOT</span>
            <div id="leaders-bottom"></div>
        </div>
    </div>

    <section class="search-wrapper">
        <div class="logo">
            <span>C</span><span>o</span><span>n</span><span>n</span><span>o</span><span>r</span>
        </div>
            <div id="search-box">
                <form id="sf" action="https://www.google.com/search" method="get">
                    <input id="q" name="q" type="text" autofocus autocomplete="off"
                        oninput="suggest(this.value)"
                        onkeydown="navDrop(event)"
                        onblur="setTimeout(hideDrop,150)"/>
                </form>
                <ul id="drop"></ul>
            </div>
        <div class="btns">
            <button onclick="location.href='https://mail.google.com'">Gmail</button>
            <button onclick="location.href='https://onq.queensu.ca/d2l/home'">OnQ</button>
            <button onclick="location.href='https://github.com/connorbuttonweb'">GitHub</button>
        </div>
                    <!--<button onclick="location.href='https://dayforcehcm.com/mydayforce/login.aspx'">DayForce</button>-->
    </section>

  <script src="/assets/js/nav.js"></script>
  <script src="/assets/js/ticker.js"></script>
  <script>
    let sel = -1, reqId = 0, debounce;

    function suggest(q) {
        clearTimeout(debounce);
        sel = -1;
        if (!q.trim()) { hideDrop(); return; }
        debounce = setTimeout(() => {
            const id = ++reqId;
            const cb = '__sg' + id;
            window[cb] = function(data) {
                if (id !== reqId) { delete window[cb]; return; }
                delete window[cb];
                const items = (data[1] || []).slice(0, 8);
                const drop = document.getElementById('drop');
                if (!items.length) { hideDrop(); return; }
                drop.innerHTML = '';
                items.forEach((s, i) => {
                    const li = document.createElement('li');
                    li.textContent = s;
                    li.onmousedown = (e) => { e.preventDefault(); pick(s); };
                    li.onmouseover = () => setActive(i);
                    drop.appendChild(li);
                });
                drop.style.display = 'block';
                document.getElementById('q').classList.add('open');
            };
            const s = document.createElement('script');
            s.src = 'https://suggestqueries.google.com/complete/search?client=firefox&q='
                + encodeURIComponent(q) + '&callback=' + cb;
            s.onerror = () => { delete window[cb]; s.remove(); };
            document.head.appendChild(s);
            s.onload = () => s.remove();
        }, 150);
    }

    function setActive(i) {
        sel = i;
        document.querySelectorAll('#drop li').forEach((el, idx) => el.classList.toggle('active', idx === i));
    }

    function hideDrop() {
        document.getElementById('drop').style.display = 'none';
        document.getElementById('q').classList.remove('open');
        sel = -1;
    }

    function pick(val) {
        document.getElementById('q').value = val;
        hideDrop();
        document.getElementById('sf').submit();
    }

    document.addEventListener('keydown', function(e) {
        if (document.activeElement === document.getElementById('q')) return;
        if (e.key === '1') location.href = 'https://mail.google.com';
        else if (e.key === '2') location.href = 'https://onq.queensu.ca/d2l/home';
        else if (e.key === '3') location.href = 'https://github.com/connorbuttonweb';
    });

    function navDrop(e) {
        const items = document.querySelectorAll('#drop li');
        if (e.key === 'ArrowDown')  { e.preventDefault(); setActive(Math.min(sel + 1, items.length - 1)); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setActive(Math.max(sel - 1, -1)); if (sel === -1) document.getElementById('q').value = document.getElementById('q').dataset.orig || ''; }
        else if (e.key === 'Enter' && sel >= 0) { e.preventDefault(); pick(items[sel].textContent); }
        else if (e.key === 'Escape') { hideDrop(); }
        // Save original typed value for up-arrow restore
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') document.getElementById('q').dataset.orig = document.getElementById('q').value;
    }
  </script>
</body>
</html>
