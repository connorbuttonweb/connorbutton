<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Market Dashboard — Connor Button</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
    <!-- Data Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.2.0"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        /* --- DASHBOARD SPECIFIC STYLES --- */
        .dashboard-controls {
            display: flex; 
            gap: 15px; 
            background: #f8f9fa; 
            padding: 20px;
            border-radius: 8px; 
            border: 1px solid #e2e3e5; 
            margin-bottom: 20px;
            flex-wrap: wrap; 
            align-items: flex-end;
        }

        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
        }

        .input-group label { 
            font-size: 12px; 
            font-weight: 600; 
            color: #555; 
            text-transform: uppercase; 
        }

        .dashboard-input { 
            padding: 10px 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            min-width: 250px; 
        }
        
        .analyze-btn { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 11px 24px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600; 
            height: 40px; 
            transition: background 0.2s;
        }

        .analyze-btn:hover { background-color: #0056b3; }
        .analyze-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* Grid Layout */
        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            margin-bottom: 40px; 
            align-items: stretch; /* Ensure both columns are equal height */
        }

        @media (min-width: 768px) { 
            .grid-container { grid-template-columns: 1fr 1fr; } 
            .full-width { grid-column: 1 / -1; } 
        }
        
        .chart-card { 
            background: white; 
            border: 1px solid #e2e3e5; 
            border-radius: 8px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            height: 100%; /* Fill the grid cell */
            min-height: 550px; /* Minimum height for consistency */
        }

        /* Removes padding for widget cards to let charts fill the space */
        .chart-card.no-padding {
            padding: 0;
            background: #131722; /* Dark background to match widgets */
        }
        
        .chart-card h3 {
            margin-top: 0; 
            margin-bottom: 10px; 
            font-size: 16px; 
            color: #333; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 8px;
        }

        /* Header for no-padding cards */
        .chart-card.no-padding h3 {
            margin: 0;
            padding: 15px;
            background: #fff;
            color: #333;
            border-bottom: 1px solid #e2e3e5;
            flex-shrink: 0; /* Prevent header from shrinking */
        }

        /* Widget Containers */
        .widget-container {
            width: 100%;
            height: 100%; /* Fill remaining flex space */
            flex-grow: 1; /* Ensure it expands */
            border: none;
            display: block;
        }
        
        .chart-box { 
            width: 100%; 
            height: 350px; 
            position: relative; 
        }

        .status-text { 
            font-size: 12px; 
            font-weight: normal; 
            color: #666; 
        }

        /* Excel Styles */
        .excel-container { 
            width: 100%; 
            overflow-x: auto; 
            background: #fff; 
            border: 1px solid #e2e3e5; 
            border-radius: 8px; 
            margin-top: 30px; 
            min-height: 100px; 
        }

        .loading-spinner { 
            text-align: center; 
            padding: 40px; 
            color: #666; 
        }
        
        .error-msg {
            color: #d32f2f;
            padding: 20px;
            text-align: center;
            font-size: 13px;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 4px;
            margin: 10px;
        }
        
        /* Table Styles for Excel */
        table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 14px; }
        th { background: #f8f9fa; padding: 10px; text-align: left; border: 1px solid #eee; }
        td { padding: 8px; border: 1px solid #eee; white-space: nowrap; }
    </style>
</head>

<body>
  <nav class="navbar">
      <div class="nav-container">
          <div class="nav-logo"><a href="/" class="logo-text">CONNOR BUTTON</a></div>
      </div>
  </nav>

    <section class="section">
        <div class="page-title">
            <h1>Cross-Market Dashboard</h1>
            <p>Trading View vs Prediction Market Probability</p>
        </div>

        <!-- SPLIT SCREEN LAYOUT -->
        <div class="grid-container">
            
            <!-- LEFT: TRADINGVIEW WIDGET -->
            <div class="chart-card no-padding">
                <h3>Equity Price Action (Live)</h3>
                <div class="widget-container">
                    <!-- TradingView Widget BEGIN -->
                    <div class="tradingview-widget-container" style="height:100%;width:100%">
                        <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                        {
                        "autosize": true,
                        "symbol": "AMEX:SPY",
                        "interval": "D",
                        "timezone": "America/New_York",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "enable_publishing": false,
                        "allow_symbol_change": true,
                        "calendar": false,
                        "support_host": "https://www.tradingview.com"
                        }
                        </script>
                    </div>
                    <!-- TradingView Widget END -->
                </div>
            </div>

            <!-- RIGHT: POLYMARKET EMBED -->
            <div class="chart-card no-padding">
                <h3>Prediction Market Probability</h3>
                <iframe
                    title="polymarket-market-iframe"
                    src="https://embed.polymarket.com/market.html?market=spx-up-or-down-on-february-5-2026&features=chart,filters&theme=dark&creator=connormcguire"
                    class="widget-container"
                    style="background: #1A1D27; border: none;"
                    width="100%"
                    height="100%">
                </iframe>
            </div>
        </div>

        <!-- BOTTOM: CUSTOM CORRELATION TOOL (Optional) -->
        <div class="dashboard-controls">
             <div style="flex: 1; min-width: 200px;">
                <strong>Custom Correlation Tool</strong><br>
                <span style="font-size: 12px; color: #666;">Use this to overlay data on a single chart (Requires API Worker)</span>
             </div>
            <div class="input-group">
                <label for="stockTicker">Stock Ticker</label>
                <input type="text" id="stockTicker" class="dashboard-input" placeholder="e.g. SPY" value="SPY">
            </div>
            <div class="input-group">
                <label for="polyInput">Polymarket Link</label>
                <input type="text" id="polyInput" class="dashboard-input" placeholder="Paste URL or ID here..." value="">
            </div>
            <button class="analyze-btn" id="analyzeBtn" onclick="updateDashboard()">Analyze</button>
        </div>

        <div class="chart-card full-width">
            <h3>Calculated Correlation <span class="status-text" id="cross-status"></span></h3>
            <div id="cross-chart" class="chart-box"></div>
        </div>
        
        <!-- Excel Area -->
        <div class="excel-container" id="excel-data"></div>
    </section>

    <script>
        // --- CONFIGURATION ---
        const PROXY_URL = "https://market-proxy.buttonconnor12.workers.dev"; 
        // ---------------------

        let crossChart, crossStockSeries, crossPolySeries;

        function getDimensions(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return { width: 600, height: 350 };
            return { width: el.clientWidth || 600, height: el.clientHeight || 350 };
        }

        function initCharts() {
            if (typeof LightweightCharts === 'undefined') {
                console.warn("Lightweight Charts library not loaded.");
                return;
            }

            const chartContainer = document.getElementById('cross-chart');
            if (!chartContainer) return;

            const chartOptions = {
                layout: { background: { type: 'solid', color: '#1E1E1E' }, textColor: '#DDD' },
                grid: { vertLines: { color: '#404040' }, horzLines: { color: '#404040' } },
                timeScale: { timeVisible: true, secondsVisible: false, borderColor: '#555' },
                rightPriceScale: { borderColor: '#555' },
            };

            const dimCross = getDimensions('cross-chart');
            crossChart = LightweightCharts.createChart(chartContainer, {
                ...chartOptions, 
                width: dimCross.width, 
                height: dimCross.height,
                leftPriceScale: { visible: true, borderColor: '#FF9800' },
                rightPriceScale: { visible: true, borderColor: '#2962FF' },
            });
            
            crossPolySeries = crossChart.addLineSeries({ 
                color: '#FF9800', lineWidth: 2, priceScaleId: 'left', title: 'Probability' 
            });
            
            crossStockSeries = crossChart.addLineSeries({ 
                color: '#2962FF', lineWidth: 2, priceScaleId: 'right', title: 'Price' 
            });
            
            window.addEventListener('resize', () => {
                if(crossChart) {
                    const d = getDimensions('cross-chart');
                    crossChart.applyOptions({ width: d.width, height: d.height });
                }
            });
        }

        async function updateDashboard() {
            const ticker = document.getElementById('stockTicker').value.trim();
            const polyInput = document.getElementById('polyInput').value.trim();
            const btn = document.getElementById('analyzeBtn');
            let polyId = polyInput;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Analyzing...';
            document.getElementById('cross-status').innerText = "(Loading...)";

            if (polyInput.includes('polymarket.com/event/')) {
                try {
                    const slug = polyInput.split('event/')[1].split('/')[0].split('?')[0];
                    const res = await fetch(`${PROXY_URL}/resolve?slug=${slug}`);
                    const data = await res.json();
                    if (data.id) polyId = data.id;
                } catch (e) {
                    console.log("Link resolve failed, trying raw ID if present");
                }
            }

            try {
                const [stockRes, polyRes] = await Promise.allSettled([
                    fetch(`${PROXY_URL}/stock?ticker=${ticker}`),
                    polyId ? fetch(`${PROXY_URL}/polymarket?id=${polyId}`) : Promise.reject("No Poly ID")
                ]);

                if(stockRes.status === 'fulfilled') {
                    const data = await stockRes.value.json();
                    if(Array.isArray(data) && data.length > 0) {
                        crossStockSeries.setData(data);
                        crossChart.timeScale().fitContent();
                    } else {
                        console.warn("Stock data empty");
                    }
                }

                if(polyRes.status === 'fulfilled') {
                    const data = await polyRes.value.json();
                    if(Array.isArray(data) && data.length > 0) {
                        if (stockRes.status === 'fulfilled') {
                             const stockJson = await stockRes.value.clone().json();
                             if(stockJson.length > 0) {
                                 const startTime = stockJson[0].time;
                                 const endTime = stockJson[stockJson.length-1].time;
                                 const clippedData = data.filter(d => d.time >= startTime && d.time <= endTime);
                                 crossPolySeries.setData(clippedData.length > 0 ? clippedData : data);
                             } else {
                                 crossPolySeries.setData(data);
                             }
                        } else {
                            crossPolySeries.setData(data);
                        }
                    }
                }
                
                document.getElementById('cross-status').innerText = "(Updated)";

            } catch(e) { 
                console.error(e);
                document.getElementById('cross-status').innerText = "(Error)";
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze";
            }
        }
        
        async function loadExcel() {
             const container = document.getElementById('excel-data');
             if(!container) return;

             // Guard: Check if running in a Blob environment (Editor Preview)
             // This prevents the "Failed to parse URL" error in the editor.
             if (window.location.protocol === 'blob:' || window.location.href.includes('blob:')) {
                 container.innerHTML = '<div class="error-msg" style="color:#666; font-size:12px;">Excel preview is unavailable in the code editor (Blob URL). Please deploy to GitHub Pages to view the Excel file.</div>';
                 return;
             }

             try {
                container.innerHTML = '<div class="loading-spinner"><i class="fas fa-circle-notch fa-spin"></i> Loading Excel...</div>';
                
                if (typeof XLSX === 'undefined') {
                    container.innerHTML = '<div class="error-msg">XLSX Library not loaded. Check internet connection.</div>';
                    return;
                }

                try {
                    const response = await fetch('/assets/PredictionMarkets/Prediction_Market_Master.xlsx');
                    if(response.ok) {
                        const ab = await response.arrayBuffer();
                        const wb = XLSX.read(new Uint8Array(ab), {type:'array'});
                        if (wb.SheetNames.length > 0) {
                            const html = XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]]);
                            container.innerHTML = html;
                        } else {
                            container.innerHTML = '<div class="error-msg">Excel file is empty.</div>';
                        }
                    } else {
                        container.innerHTML = '<div class="error-msg">Excel file not found at /assets/PredictionMarkets/</div>';
                    }
                } catch (fetchErr) {
                    console.warn("Fetch failed:", fetchErr);
                    container.innerHTML = '<div class="error-msg">Excel file not found (Path Error).</div>';
                }
             } catch(e) {
                 console.error(e);
                 container.innerHTML = '<div class="error-msg">Failed to parse Excel file.</div>';
             }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCharts();
            loadExcel();
        });
    </script>
</body>
</html>
