<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cross-Market Dashboard — Connor Button</title>
    <link rel="stylesheet" href="/assets/css/main.css" />
    <link rel="icon" type="image/png" href="/assets/images/favicon.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
    <!-- Data Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.0.1"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.2.0"></script>
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>

    <style>
        /* --- DASHBOARD SPECIFIC STYLES --- */
        .dashboard-controls {
            display: flex; 
            gap: 15px; 
            background: #f8f9fa; 
            padding: 20px;
            border-radius: 8px; 
            border: 1px solid #e2e3e5; 
            margin-bottom: 20px;
            flex-wrap: wrap; 
            align-items: flex-end;
        }

        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 5px; 
            flex: 1;
            min-width: 200px;
        }

        .input-group label { 
            font-size: 12px; 
            font-weight: 600; 
            color: #555; 
            text-transform: uppercase; 
        }

        .dashboard-input { 
            padding: 10px 12px; 
            border: 1px solid #ccc; 
            border-radius: 4px; 
            width: 100%; 
        }
        
        .analyze-btn { 
            background-color: #007bff; 
            color: white; 
            border: none; 
            padding: 11px 24px; 
            border-radius: 4px; 
            cursor: pointer; 
            font-weight: 600; 
            height: 40px; 
            transition: background 0.2s;
            min-width: 120px;
        }

        .analyze-btn:hover { background-color: #0056b3; }
        .analyze-btn:disabled { background-color: #ccc; cursor: not-allowed; }
        
        /* Grid Layout */
        .grid-container { 
            display: grid; 
            grid-template-columns: 1fr; 
            gap: 20px; 
            margin-bottom: 40px; 
            align-items: stretch; 
        }

        @media (min-width: 768px) { 
            .grid-container { grid-template-columns: 1fr 1fr; } 
            .full-width { grid-column: 1 / -1; } 
        }
        
        .chart-card { 
            background: white; 
            border: 1px solid #e2e3e5; 
            border-radius: 8px; 
            padding: 15px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden;
            height: 100%; 
            min-height: 550px; 
        }

        .chart-card.no-padding {
            padding: 0;
            background: #131722; 
        }
        
        /* Card Headers */
        .chart-card h3 {
            margin: 0 0 10px 0;
            font-size: 16px; 
            color: #333; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chart-card.no-padding h3 {
            margin: 0;
            padding: 15px;
            background: #fff;
            color: #333;
            border-bottom: 1px solid #e2e3e5;
            flex-shrink: 0; 
        }

        /* Live Probability Indicator */
        .prob-indicator {
            font-weight: 700;
            font-size: 18px;
            color: #00b894; /* Green */
        }
        .prob-label {
            font-size: 12px;
            color: #666;
            margin-right: 5px;
            font-weight: 400;
        }

        /* Widget Containers */
        .widget-container {
            width: 100%;
            height: 100%; 
            flex-grow: 1; 
            border: none;
            display: block;
            position: relative;
        }
        
        .chart-box { 
            width: 100%; 
            height: 350px; 
            position: relative; 
        }

        .status-text { 
            font-size: 12px; 
            font-weight: normal; 
            color: #666; 
        }

        /* Excel Styles */
        .excel-container { 
            width: 100%; 
            overflow-x: auto; 
            background: #fff; 
            border: 1px solid #e2e3e5; 
            border-radius: 8px; 
            margin-top: 30px; 
            min-height: 100px; 
        }

        .loading-spinner { 
            text-align: center; 
            padding: 40px; 
            color: #666; 
        }
        
        .error-msg {
            color: #d32f2f;
            padding: 20px;
            text-align: center;
            font-size: 13px;
            background: #fff5f5;
            border: 1px solid #fed7d7;
            border-radius: 4px;
            margin: 10px;
        }
        
        /* Table Styles for Excel */
        table { width: 100%; border-collapse: collapse; font-family: sans-serif; font-size: 14px; }
        th { background: #f8f9fa; padding: 10px; text-align: left; border: 1px solid #eee; }
        td { padding: 8px; border: 1px solid #eee; white-space: nowrap; }
    </style>
</head>

<body>
  <nav class="navbar">
      <div class="nav-container">
          <div class="nav-logo"><a href="/" class="logo-text">CONNOR BUTTON</a></div>
      </div>
  </nav>

    <section class="section">
        <div class="page-title">
            <h1>Cross-Market Dashboard</h1>
            <p>Trading View vs Prediction Market Probability</p>
        </div>

        <!-- SPLIT SCREEN LAYOUT -->
        <div class="grid-container">
            
            <!-- LEFT: TRADINGVIEW WIDGET -->
            <div class="chart-card no-padding">
                <h3>Equity Price Action (Live)</h3>
                <div class="widget-container">
                    <!-- TradingView Widget BEGIN -->
                    <div class="tradingview-widget-container" style="height:100%;width:100%">
                        <div class="tradingview-widget-container__widget" style="height:100%;width:100%"></div>
                        <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                        {
                        "autosize": true,
                        "symbol": "AMEX:SPY",
                        "interval": "1",
                        "range": "1D",
                        "timezone": "America/New_York",
                        "theme": "dark",
                        "style": "1",
                        "locale": "en",
                        "enable_publishing": false,
                        "allow_symbol_change": true,
                        "calendar": false,
                        "support_host": "https://www.tradingview.com"
                        }
                        </script>
                    </div>
                    <!-- TradingView Widget END -->
                </div>
            </div>

            <!-- RIGHT: POLYMARKET API CHART -->
            <div class="chart-card no-padding">
                <h3 id="poly-header-title">
                    <span>Prediction Market</span>
                    <span><span class="prob-label">Probability:</span><span id="poly-header-price" class="prob-indicator">--%</span></span>
                </h3>
                <!-- Custom Lightweight Chart Container -->
                <div id="poly-main-chart" class="widget-container"></div>
            </div>
        </div>

        <!-- BOTTOM: CONTROLS & CORRELATION -->
        <div class="dashboard-controls">
             <div style="flex: 1; min-width: 200px;">
                <strong>Market Controls</strong><br>
                <span style="font-size: 12px; color: #666;">Enter a Ticker and a Polymarket Link to analyze relationships.</span>
             </div>
            <div class="input-group">
                <label for="stockTicker">Stock Ticker</label>
                <input type="text" id="stockTicker" class="dashboard-input" placeholder="e.g. SPY" value="SPY">
            </div>
            <div class="input-group">
                <label for="polyInput">Polymarket Link / ID</label>
                <!-- Defaulted to the SPX market you requested -->
                <input type="text" id="polyInput" class="dashboard-input" 
                       placeholder="Paste URL..." 
                       value="https://polymarket.com/event/spx-up-or-down-on-february-5-2026">
            </div>
            <button class="analyze-btn" id="analyzeBtn" onclick="updateDashboard()">Update Charts</button>
        </div>

        <div class="chart-card full-width">
            <h3>Calculated Correlation <span class="status-text" id="cross-status"></span></h3>
            <div id="cross-chart" class="chart-box"></div>
        </div>
        
        <!-- Excel Area -->
        <div class="excel-container" id="excel-data"></div>
    </section>

    <script>
        // --- CONFIGURATION ---
        const PROXY_URL = "https://market-proxy.buttonconnor12.workers.dev"; 
        // ---------------------

        let crossChart, polyMainChart;
        let crossStockSeries, crossPolySeries, polyMainSeries;

        function getDimensions(elementId) {
            const el = document.getElementById(elementId);
            if (!el) return { width: 600, height: 350 };
            return { width: el.clientWidth || 600, height: el.clientHeight || 350 };
        }

        function initCharts() {
            if (typeof LightweightCharts === 'undefined') {
                console.warn("Charts lib missing");
                return;
            }

            // Common Options (Dark Theme) + Timezone Fix
            const commonOptions = {
                layout: { background: { type: 'solid', color: '#1E1E1E' }, textColor: '#DDD' },
                grid: { vertLines: { color: '#2B2B43' }, horzLines: { color: '#2B2B43' } },
                // Important: Set timezone to NY to fix the 14:30 vs 9:30 issue
                localization: {
                    timezone: 'America/New_York', 
                },
                timeScale: { 
                    timeVisible: true, 
                    secondsVisible: false, 
                    borderColor: '#555' 
                },
                rightPriceScale: { borderColor: '#555' },
            };

            // 1. TOP RIGHT: Main Polymarket Chart
            const polyContainer = document.getElementById('poly-main-chart');
            const dimPoly = getDimensions('poly-main-chart');
            polyMainChart = LightweightCharts.createChart(polyContainer, {
                ...commonOptions,
                width: dimPoly.width,
                height: dimPoly.height,
            });
            polyMainSeries = polyMainChart.addLineSeries({
                color: '#00b894', // Polymarket Green
                lineWidth: 2,
                title: 'Probability',
                priceFormat: { type: 'percent', precision: 1, minMove: 0.1 },
            });

            // 2. BOTTOM: Correlation Chart (Dual Axis)
            const crossContainer = document.getElementById('cross-chart');
            const dimCross = getDimensions('cross-chart');
            crossChart = LightweightCharts.createChart(crossContainer, {
                ...commonOptions,
                width: dimCross.width,
                height: dimCross.height,
                leftPriceScale: { visible: true, borderColor: '#FF9800' },
                rightPriceScale: { visible: true, borderColor: '#2962FF' },
            });
            crossPolySeries = crossChart.addLineSeries({ color: '#FF9800', lineWidth: 2, priceScaleId: 'left', title: 'Probability' });
            crossStockSeries = crossChart.addLineSeries({ color: '#2962FF', lineWidth: 2, priceScaleId: 'right', title: 'Price' });

            // Resize Handler
            window.addEventListener('resize', () => {
                const dp = getDimensions('poly-main-chart');
                if(polyMainChart) polyMainChart.applyOptions({ width: dp.width, height: dp.height });
                
                const dc = getDimensions('cross-chart');
                if(crossChart) crossChart.applyOptions({ width: dc.width, height: dc.height });
            });
        }

        async function updateDashboard() {
            const ticker = document.getElementById('stockTicker').value.trim();
            const polyInput = document.getElementById('polyInput').value.trim();
            const btn = document.getElementById('analyzeBtn');
            let polyId = polyInput;

            // UI State
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Loading...';
            document.getElementById('cross-status').innerText = "(Fetching...)";

            // 1. Resolve Polymarket Link
            if (polyInput.includes('polymarket.com/event/')) {
                try {
                    const slug = polyInput.split('event/')[1].split('/')[0].split('?')[0];
                    const res = await fetch(`${PROXY_URL}/resolve?slug=${slug}`);
                    const data = await res.json();
                    
                    if (data.id) {
                        polyId = data.id;
                        if(data.question) document.getElementById('poly-header-title').querySelector('span').innerText = data.question;
                    }
                } catch (e) { console.log("Resolver skipped"); }
            }

            // 2. Fetch Data (Parallel)
            try {
                const [stockRes, polyRes] = await Promise.allSettled([
                    fetch(`${PROXY_URL}/stock?ticker=${ticker}`),
                    polyId ? fetch(`${PROXY_URL}/polymarket?id=${polyId}`) : Promise.reject("No ID")
                ]);

                let stockData = [];
                let polyData = [];

                // 3. Process Stock Data
                if(stockRes.status === 'fulfilled') {
                    const data = await stockRes.value.json();
                    if(Array.isArray(data) && data.length > 0) {
                        stockData = data;
                    }
                }

                // 4. Process Poly Data
                if(polyRes.status === 'fulfilled') {
                    const data = await polyRes.value.json();
                    if(Array.isArray(data) && data.length > 0) {
                        polyData = data;
                        
                        // A. Render Full Chart (Top Right)
                        // If we have stock data, let's auto-zoom the Poly chart to the relevant trading day
                        // This fixes the "hiding half the chart" issue by focusing on the active session
                        if (stockData.length > 0) {
                            const startTime = stockData[0].time;
                            const endTime = stockData[stockData.length - 1].time;
                            // Clip the visualization of the top-right chart to match the stock day
                            const clippedTop = polyData.filter(d => d.time >= startTime && d.time <= endTime);
                            polyMainSeries.setData(clippedTop.length > 0 ? clippedTop : polyData);
                        } else {
                            polyMainSeries.setData(polyData);
                        }
                        
                        polyMainChart.timeScale().fitContent();

                        // Update Current Probability in Header
                        const lastVal = polyData[polyData.length - 1].value;
                        const probPercent = (lastVal * 100).toFixed(1) + '%';
                        document.getElementById('poly-header-price').innerText = probPercent;
                    }
                }

                // 5. Render Correlation Chart (Bottom)
                if (stockData.length > 0 && polyData.length > 0) {
                     crossStockSeries.setData(stockData);
                     
                     const startTime = stockData[0].time;
                     const endTime = stockData[stockData.length-1].time;
                     
                     // Clip Poly data to match stock window exactly
                     const clipped = polyData.filter(d => d.time >= startTime && d.time <= endTime);
                     crossPolySeries.setData(clipped.length > 0 ? clipped : polyData);
                } else {
                    if (stockData.length > 0) crossStockSeries.setData(stockData);
                    if (polyData.length > 0) crossPolySeries.setData(polyData);
                }
                
                // Force Zoom Out
                crossChart.timeScale().fitContent();
                
                document.getElementById('cross-status').innerText = "(Updated)";

            } catch(e) {
                console.error(e);
                document.getElementById('cross-status').innerText = "(Error)";
            } finally {
                btn.disabled = false;
                btn.innerText = "Update Charts";
            }
        }
        
        async function loadExcel() {
             const container = document.getElementById('excel-data');
             if(!container) return;
             if (window.location.protocol === 'blob:' || window.location.href.includes('blob:')) {
                 container.innerHTML = '<div class="error-msg" style="color:#666; font-size:12px;">Excel preview unavailable in editor. Deploy to view.</div>';
                 return;
             }
             try {
                container.innerHTML = '<div class="loading-spinner"><i class="fas fa-circle-notch fa-spin"></i> Loading Excel...</div>';
                if (typeof XLSX === 'undefined') return;
                const response = await fetch('/assets/PredictionMarkets/Prediction_Market_Master.xlsx');
                if(response.ok) {
                    const ab = await response.arrayBuffer();
                    const wb = XLSX.read(new Uint8Array(ab), {type:'array'});
                    if (wb.SheetNames.length > 0) container.innerHTML = XLSX.utils.sheet_to_html(wb.Sheets[wb.SheetNames[0]]);
                } else {
                    container.innerHTML = '<div class="error-msg">Excel file not found.</div>';
                }
             } catch(e) { container.innerHTML = '<div class="error-msg">Failed to parse Excel.</div>'; }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initCharts();
            loadExcel();
            setTimeout(updateDashboard, 500);
        });
    </script>
</body>
</html>
