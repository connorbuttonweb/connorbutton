name: Update Market Tracker

on:
  schedule:
    # Runs at 21:30 UTC every Mon-Fri (Approx 4:30 PM EST / 5:30 PM EDT)
    # This ensures the market is closed and full intraday data is available.
    - cron: '30 21 * * 1-5'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas openpyxl yfinance py-clob-client

    - name: Run market tracker
      run: python assets/PredictionMarkets/market_tracker.py

    - name: Commit and push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        # Adds the Excel file if it was created or updated
        git add assets/PredictionMarkets/Prediction_Market_Master.xlsx
        # Only commit if there are changes to avoid empty commit errors
        git commit -m "Automated data update: $(date)" || echo "No changes to commit"
        git push